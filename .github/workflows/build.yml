name: Build NEVADA CINE PLUS APK v2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Clean Cordova Android TV App
        run: |
          rm -rf app_build
          cordova create app_build com.bestream.nevadacineplus.v2 "NEVADA CINE PLUS"
          rm -rf app_build/www/*
          cp index.html app_build/www/index.html
          cat << 'EOF' > app_build/config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.bestream.nevadacineplus.v2" version="2.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:android="http://schemas.android.com/apk/res/android">
              <name>NEVADA CINE PLUS</name>
              <description>NEVADA CINE PLUS powered by BE STREAM</description>
              <author email="support@bestram.live" href="https://bestram.live">BE STREAM</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-navigation href="*" />
              <preference name="Orientation" value="landscape" />
              <preference name="Fullscreen" value="true" />
              <preference name="AndroidUsesCleartextTraffic" value="true" />
              <platform name="android">
                  <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application">
                      <application android:usesCleartextTraffic="true" android:banner="@mipmap/ic_launcher" />
                  </edit-config>
              </platform>
          </widget>
          EOF
          cd app_build
          cordova platform add android
          cordova build android

      - name: Upload NEVADA CINE PLUS APK
        uses: actions/upload-artifact@v4
        with:
          name: NEVADA-CINE-PLUS-V2-APK
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
